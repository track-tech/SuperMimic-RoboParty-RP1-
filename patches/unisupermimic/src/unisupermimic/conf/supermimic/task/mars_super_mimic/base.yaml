# @package _global_
# SuperMimic's analytic MDP and full world-model training contract.
# Mars_v3: 6 actuated DoF (3/leg, no ankle, no arms), 2.19 kg, ~0.25 m leg.
env:
  seed: null
  scene:
    model_file: src/unisupermimic/assets/robots/mars/scene_supermimic.xml
    default_keyframe_name: stand
    entities:
      robot:
        root_body_name: base_link
        joint_names: &mars_joints
          - abad_L_joint
          - hip_L_joint
          - knee_L_joint
          - abad_R_joint
          - hip_R_joint
          - knee_R_joint
        actuator_names:
          - abad_L_joint_motor
          - hip_L_joint_motor
          - knee_L_joint_motor
          - abad_R_joint_motor
          - hip_R_joint_motor
          - knee_R_joint_motor
        body_names:
          - base_link
          - hip_L_Link
          - knee_L_Link
          - foot_L_Link
          - hip_R_Link
          - knee_R_Link
          - foot_R_Link
      ground:
        geom_names: [floor]
  sim_dt: 0.0025
  ctrl_dt: 0.02
  max_episode_seconds: 10.0
  auto_reset: true
  scale_rewards_by_dt: false
  observations:
    policy:
      enable_corruption: false
      terms:
        obs:
          func: unisupermimic.tasks.motion_tracking.g1.supermimic.manager_terms.supermimic_obs
          params: {command_name: motion}
    future:
      enable_corruption: false
      terms:
        goal:
          func: unisupermimic.tasks.motion_tracking.g1.supermimic.manager_terms.supermimic_goal
          params: {command_name: motion, num_frames: 10}
  actions:
    joint_pos:
      _target_: unisupermimic.tasks.motion_tracking.g1.supermimic.manager_terms.SuperMimicActionCfg
      entity_name: robot
      command_name: motion
  commands:
    motion:
      _target_: unisupermimic.tasks.motion_tracking.g1.supermimic.manager_terms.SuperMimicCommandCfg
      entity_name: robot
      mjcf_path: src/unisupermimic/assets/robots/mars/mars_supermimic.xml
      eval_mode: false
      gamma: 0.99
      src_fps: 30.0
      reset_noise: true
      max_episode_steps: 500
      goal_frames: 10
      context_dim: 10
      resampling_time_range: [1.0e9, 1.0e9]
      motion_files: &mars_motions
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/walk1_subject1.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/walk1_subject2.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/walk1_subject5.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/walk2_subject1.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/walk2_subject3.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/walk2_subject4.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/walk3_subject1.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/walk3_subject2.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/walk3_subject3.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/walk3_subject4.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/walk3_subject5.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/walk4_subject1.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/run1_subject2.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/run1_subject5.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/run2_subject1.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/run2_subject4.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/sprint1_subject2.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/sprint1_subject4.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/jumps1_subject1.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/jumps1_subject2.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/jumps1_subject5.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/dance1_subject2.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/dance1_subject3.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/dance2_subject1.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/dance2_subject2.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/dance2_subject3.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/dance2_subject5.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/fight1_subject2.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/fight1_subject3.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/fight1_subject5.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/fightAndSports1_subject1.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/fightAndSports1_subject4.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/fallAndGetUp1_subject1.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/fallAndGetUp1_subject4.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/fallAndGetUp1_subject5.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/fallAndGetUp2_subject2.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/fallAndGetUp2_subject3.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/fallAndGetUp3_subject1.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/dance1_subject1.csv
        - src/unisupermimic/assets/motions/mars/lafan1_supermimic/dance2_subject4.csv
  events:
    startup_context:
      _target_: unilab.managers.EventTermCfg
      func: unisupermimic.tasks.motion_tracking.g1.supermimic.manager_terms.SuperMimicContextEvent
      mode: startup
      params:
        command_name: motion
        asset_cfg: &context_robot
          _target_: unilab.managers.SceneEntityCfg
          name: robot
        ground_asset_cfg: &context_ground
          _target_: unilab.managers.SceneEntityCfg
          name: ground
          geom_names: [floor]
    reset_context:
      _target_: unilab.managers.EventTermCfg
      func: unisupermimic.tasks.motion_tracking.g1.supermimic.manager_terms.SuperMimicContextEvent
      mode: reset
      params:
        command_name: motion
        asset_cfg: *context_robot
        ground_asset_cfg: *context_ground
    joint_offsets:
      _target_: unilab.managers.EventTermCfg
      func: unisupermimic.tasks.motion_tracking.g1.supermimic.manager_terms.SuperMimicJointOffsetEvent
      mode: reset
      params: {command_name: motion}
  terminations:
    hard:
      _target_: unilab.managers.TerminationTermCfg
      func: unisupermimic.tasks.motion_tracking.g1.supermimic.manager_terms.supermimic_termination
      params: {command_name: motion}
    timeout:
      _target_: unilab.managers.TerminationTermCfg
      func: unisupermimic.tasks.motion_tracking.g1.supermimic.manager_terms.supermimic_timeout
      time_out: true
      params: {command_name: motion}
    clip_end:
      _target_: unilab.managers.TerminationTermCfg
      func: unisupermimic.tasks.motion_tracking.g1.supermimic.manager_terms.supermimic_clip_end
      time_out: true
      params: {command_name: motion}
  policy_observation_group: policy
  critic_observation_group: future

reward:
  tracking:
    _target_: unilab.managers.RewardTermCfg
    func: unisupermimic.tasks.motion_tracking.g1.supermimic.manager_terms.supermimic_reward
    weight: 1.0
    params: {command_name: motion}
